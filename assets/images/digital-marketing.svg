<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1e"/>
      <stop offset="50%" stop-color="#111636"/>
      <stop offset="100%" stop-color="#0a0d24"/>
    </linearGradient>
    <linearGradient id="dmCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="dmPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="dmGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="dmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#dmBg)"/>

  <!-- Glowing backdrop orbs -->
  <circle cx="120" cy="80" r="130" fill="#00d4ff" opacity="0.12" filter="url(#dmGlow)"/>
  <circle cx="700" cy="360" r="140" fill="#ec4899" opacity="0.12" filter="url(#dmGlow)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(30, 25)">
    <!-- Window Frame -->
    <rect width="740" height="400" rx="12" fill="#0d122b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.35"/>
    
    <!-- Titlebar -->
    <rect width="740" height="38" rx="12" fill="#141a3a"/>
    <rect y="26" width="740" height="12" fill="#141a3a"/>
    <line x1="0" y1="38" x2="740" y2="38" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Window Dots -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="80" y="8" width="430" height="22" rx="6" fill="#0a0e22" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="95" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      <tspan fill="#a855f7">https://</tspan>appverse-technologies.com/qazi-israr-ahmad/
    </text>

    <!-- Verified Badge -->
    <rect x="590" y="8" width="135" height="22" rx="11" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="0.8"/>
    <circle cx="602" cy="19" r="3.5" fill="#a855f7"/>
    <text x="612" y="23" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#e9d5ff">Marketing Showcase</text>

    <!-- Dashboard Content -->
    <g transform="translate(25, 55)">
      <!-- Dashboard Top Info -->
      <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="19" font-weight="800" fill="#ffffff">Performance Marketing &amp; SEO Suite</text>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Google Ads · Meta Ads · GA4 · Technical SEO &amp; Email Funnels</text>

      <!-- KPI Metrics Strip -->
      <g transform="translate(0, 52)">
        <!-- KPI 1: Organic & Paid Reach -->
        <rect width="160" height="68" rx="8" fill="#151b3d" stroke="#00d4ff" stroke-opacity="0.25"/>
        <text x="14" y="20" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">TOTAL CAMPAIGN REACH</text>
        <text x="14" y="47" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#00d4ff">850K+</text>
        <text x="14" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">↑ +42% vs previous</text>

        <!-- KPI 2: Conversion Rate -->
        <rect x="175" y="0" width="160" height="68" rx="8" fill="#151b3d" stroke="#a855f7" stroke-opacity="0.25"/>
        <text x="189" y="20" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">CONVERSION RATE</text>
        <text x="189" y="47" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#a855f7">6.4%</text>
        <text x="189" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#10b981">↑ Optimized Funnel</text>

        <!-- KPI 3: Organic Keywords -->
        <rect x="350" y="0" width="160" height="68" rx="8" fill="#151b3d" stroke="#10b981" stroke-opacity="0.25"/>
        <text x="364" y="20" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">TOP 10 KEYWORDS</text>
        <text x="364" y="47" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#10b981">+128</text>
        <text x="364" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#38bdf8">Google Search Console</text>

        <!-- KPI 4: Avg CTR -->
        <rect x="525" y="0" width="165" height="68" rx="8" fill="#151b3d" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="539" y="20" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">AVERAGE AD CTR</text>
        <text x="539" y="47" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" fill="#ffffff">4.82%</text>
        <text x="539" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#f59e0b">Meta &amp; Google Ads</text>
      </g>

      <!-- Main Section: Left Chart, Right Channel Split -->
      <g transform="translate(0, 134)">
        <!-- Chart Container -->
        <rect width="455" height="190" rx="8" fill="#090d22" stroke="#ffffff" stroke-opacity="0.08"/>
        <text x="16" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Traffic &amp; Conversion Growth</text>
        <text x="330" y="23" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">LAST 90 DAYS</text>

        <!-- Grid Lines for Chart -->
        <g stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="3,3">
          <line x1="20" y1="60" x2="435" y2="60"/>
          <line x1="20" y1="100" x2="435" y2="100"/>
          <line x1="20" y1="140" x2="435" y2="140"/>
        </g>

        <!-- Area Curve 1 (Cyan) -->
        <path d="M 25 155 Q 85 130 145 120 T 265 90 T 365 65 T 435 48 L 435 165 L 25 165 Z" fill="url(#dmCyan)"/>
        <path d="M 25 155 Q 85 130 145 120 T 265 90 T 365 65 T 435 48" fill="none" stroke="#00d4ff" stroke-width="2.5"/>

        <!-- Area Curve 2 (Purple) -->
        <path d="M 25 162 Q 85 150 145 142 T 265 125 T 365 105 T 435 88 L 435 165 L 25 165 Z" fill="url(#dmPurple)"/>
        <path d="M 25 162 Q 85 150 145 142 T 265 125 T 365 105 T 435 88" fill="none" stroke="#a855f7" stroke-width="2"/>

        <!-- Chart Legend -->
        <circle cx="30" cy="178" r="4" fill="#00d4ff"/>
        <text x="40" y="181" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Organic Traffic</text>
        <circle cx="120" cy="178" r="4" fill="#a855f7"/>
        <text x="130" y="181" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">Paid Conversions</text>

        <!-- Right Side: Tools & Channel Badges -->
        <g transform="translate(470, 0)">
          <rect width="220" height="190" rx="8" fill="#0f1533" stroke="#a855f7" stroke-opacity="0.2"/>
          <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Marketing Stack</text>

          <g transform="translate(14, 38)">
            <!-- Item 1: Meta Ads -->
            <rect width="192" height="30" rx="5" fill="#141c42"/>
            <text x="10" y="19" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Meta Ads Manager</text>
            <text x="145" y="19" font-family="'Inter', sans-serif" font-size="9.5" fill="#10b981">48% Share</text>

            <!-- Item 2: Google Ads -->
            <rect y="36" width="192" height="30" rx="5" fill="#141c42"/>
            <text x="10" y="55" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Google Ads &amp; Search</text>
            <text x="145" y="55" font-family="'Inter', sans-serif" font-size="9.5" fill="#00d4ff">34% Share</text>

            <!-- Item 3: SEO Audit -->
            <rect y="72" width="192" height="30" rx="5" fill="#141c42"/>
            <text x="10" y="91" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">Screaming Frog &amp; GSC</text>
            <text x="145" y="91" font-family="'Inter', sans-serif" font-size="9.5" fill="#a855f7">18% Share</text>

            <!-- Item 4: GA4 & Tag Assistant -->
            <rect y="108" width="192" height="30" rx="5" fill="#141c42"/>
            <text x="10" y="127" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ffffff">GA4 &amp; Tag Assistant</text>
            <text x="145" y="127" font-family="'Inter', sans-serif" font-size="9.5" fill="#f59e0b">Active</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
