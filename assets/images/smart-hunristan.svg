<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24"/>
      <stop offset="50%" stop-color="#101736"/>
      <stop offset="100%" stop-color="#0a0d20"/>
    </linearGradient>
    <linearGradient id="shCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f42"/>
      <stop offset="100%" stop-color="#121833"/>
    </linearGradient>
    <filter id="shGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#shBg)"/>

  <!-- Subtle Grid lines -->
  <g opacity="0.07" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Glowing background orbs -->
  <circle cx="700" cy="80" r="120" fill="#a855f7" opacity="0.12" filter="url(#shGlow)"/>
  <circle cx="150" cy="380" r="140" fill="#00d4ff" opacity="0.12" filter="url(#shGlow)"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(30, 25)">
    <!-- Window Frame -->
    <rect width="740" height="400" rx="12" fill="#0f142b" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.3"/>
    
    <!-- Titlebar -->
    <rect width="740" height="38" rx="12" fill="#151b38"/>
    <rect y="26" width="740" height="12" fill="#151b38"/>
    <line x1="0" y1="38" x2="740" y2="38" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- Window Dots -->
    <circle cx="20" cy="19" r="5" fill="#ef4444"/>
    <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="19" r="5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="80" y="8" width="400" height="22" rx="6" fill="#0d1124" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="95" y="23" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
      <tspan fill="#00d4ff">https://</tspan>hunristan.vercel.app/competition/eval
    </text>

    <!-- Status Badge -->
    <rect x="610" y="8" width="115" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="622" cy="19" r="3.5" fill="#10b981"/>
    <text x="632" y="23" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#34d399">AI Live Evaluator</text>

    <!-- App Header Inside -->
    <g transform="translate(25, 55)">
      <!-- Brand & FYP Title -->
      <text x="0" y="20" font-family="'Outfit', sans-serif" font-size="19" font-weight="800" fill="#ffffff">Smart Hunristan</text>
      <text x="160" y="19" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a855f7">CAPSTONE FYP</text>
      <text x="0" y="38" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">AI-Powered Hackathon &amp; Automated Code Evaluation Platform</text>
      
      <!-- Top Metrics Cards -->
      <g transform="translate(0, 52)">
        <!-- Card 1: AI Code Score -->
        <rect width="215" height="74" rx="8" fill="url(#shCard)" stroke="#00d4ff" stroke-opacity="0.3"/>
        <text x="14" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">AI CODE EVALUATION</text>
        <text x="14" y="52" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" fill="#00d4ff">98.4<tspan font-size="14" fill="#94a3b8">/100</tspan></text>
        <text x="145" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10b981">✓ Optimal</text>

        <!-- Card 2: Submissions -->
        <rect x="235" y="0" width="215" height="74" rx="8" fill="url(#shCard)" stroke="#a855f7" stroke-opacity="0.3"/>
        <text x="249" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">TEAMS &amp; PARTICIPANTS</text>
        <text x="249" y="52" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" fill="#a855f7">142 <tspan font-size="13" fill="#94a3b8">Teams</tspan></text>
        <text x="380" y="50" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#00d4ff">Active</text>

        <!-- Card 3: Supabase & RBAC -->
        <rect x="470" y="0" width="220" height="74" rx="8" fill="url(#shCard)" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="484" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="0.5">ARCHITECTURE</text>
        <text x="484" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Next.js 15 · Supabase</text>
        <text x="484" y="62" font-family="'Inter', sans-serif" font-size="10" fill="#38bdf8">Role-Based Access Control</text>
      </g>

      <!-- Main Panels: Left Code Review, Right Leaderboard -->
      <g transform="translate(0, 140)">
        <!-- Left Panel: Code Analysis Terminal -->
        <rect width="420" height="180" rx="8" fill="#090d21" stroke="#ffffff" stroke-opacity="0.08"/>
        <rect width="420" height="26" rx="8" fill="#121833"/>
        <rect y="18" width="420" height="8" fill="#121833"/>
        <text x="14" y="17" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">eval_model.ts — Live AST &amp; Test Suite</text>

        <g transform="translate(14, 42)" font-family="'Fira Code', monospace" font-size="10" line-height="1.5">
          <text y="0" fill="#c084fc">import <tspan fill="#38bdf8">{ evaluateCode }</tspan> from <tspan fill="#86efac">'@ai/engine'</tspan>;</text>
          <text y="18" fill="#94a3b8">// Automated submission grading running on Supabase</text>
          <text y="36" fill="#fde047">const <tspan fill="#e2e8f0">result</tspan> = <tspan fill="#38bdf8">await</tspan> evaluateCode(submission);</text>
          <text y="54" fill="#86efac">✓ Time Complexity: O(n log n) - Passed 100%</text>
          <text y="72" fill="#86efac">✓ Memory Utilization: 14.2 MB - Optimal</text>
          <text y="90" fill="#00d4ff">✓ Security &amp; Vulnerability Check: 0 Issues</text>
          <text y="108" fill="#a855f7">→ Leaderboard Rank Updated in Realtime</text>
        </g>

        <!-- Right Panel: Leaderboard -->
        <g transform="translate(435, 0)">
          <rect width="255" height="180" rx="8" fill="#0e142e" stroke="#00d4ff" stroke-opacity="0.2"/>
          <text x="14" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Live Leaderboard</text>
          <text x="190" y="23" font-family="'Inter', sans-serif" font-size="9.5" fill="#00d4ff">TOP TEAMS</text>

          <!-- Rank 1 -->
          <g transform="translate(14, 40)">
            <rect width="227" height="36" rx="6" fill="#151d3f" stroke="#00d4ff" stroke-opacity="0.3"/>
            <circle cx="16" cy="18" r="9" fill="url(#shCyan)"/>
            <text x="13" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#051026">1</text>
            <text x="34" y="16" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">Alpha Coders</text>
            <text x="34" y="28" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">99.2 pts · 12 min</text>
            <text x="180" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#10b981">Rank #1</text>
          </g>

          <!-- Rank 2 -->
          <g transform="translate(14, 84)">
            <rect width="227" height="36" rx="6" fill="#121833" stroke="#ffffff" stroke-opacity="0.05"/>
            <circle cx="16" cy="18" r="9" fill="#a855f7"/>
            <text x="13" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff">2</text>
            <text x="34" y="16" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">ByteCraft</text>
            <text x="34" y="28" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">97.8 pts · 16 min</text>
            <text x="180" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#a855f7">Rank #2</text>
          </g>

          <!-- Rank 3 -->
          <g transform="translate(14, 128)">
            <rect width="227" height="36" rx="6" fill="#121833" stroke="#ffffff" stroke-opacity="0.05"/>
            <circle cx="16" cy="18" r="9" fill="#334155"/>
            <text x="13" y="22" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#cbd5e1">3</text>
            <text x="34" y="16" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#cbd5e1">Nexus Labs</text>
            <text x="34" y="28" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">95.4 pts · 21 min</text>
            <text x="180" y="22" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Rank #3</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
